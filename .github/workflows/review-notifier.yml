name: Review Issue Notifier

# This workflow notifies when Codex posts review feedback
# It formats issues for easy fixing with Claude Code

on:
  pull_request_review:
    types: [submitted]

  pull_request_review_comment:
    types: [created]

  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check'
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  notify-review-issues:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.review && github.event.review.state != 'APPROVED') ||
      (github.event.review && github.event.review.body != '') ||
      (github.event.comment && !contains(github.event.comment.body, '<!-- claude-review-'))

    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber = context.payload.pull_request?.number ||
                          context.payload.inputs?.pr_number;

            if (!prNumber && context.payload.issue) {
              if (context.payload.issue.pull_request) {
                prNumber = context.payload.issue.number;
              } else {
                console.log('Comment is on an issue, not a PR. Skipping.');
                return;
              }
            }

            if (!prNumber) {
              console.log('Could not determine PR number');
              return;
            }

            core.setOutput('number', prNumber);

      - name: Collect and format review issues
        if: steps.pr.outputs.number
        id: issues
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });

            const codexPattern = /codex-connector|chatgpt-codex/i;
            const codexReviews = reviews
              .filter(r => codexPattern.test(r.user.login))
              .sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));

            if (codexReviews.length === 0) {
              console.log('No Codex reviews found');
              core.setOutput('has_issues', 'false');
              return;
            }

            const latestCodexReview = codexReviews[0];
            const latestReviewId = latestCodexReview.id;
            console.log("Latest Codex review ID: " + latestReviewId);

            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });

            const issues = [];
            const bodyText = latestCodexReview.body || "";

            // Counting rule: inline comments are always issues. The review body
            // is a summary — render it as context, not as an issue — UNLESS it's
            // the only signal (CHANGES_REQUESTED + zero inline comments), in
            // which case it IS the feedback and counts as one issue.
            // This mirrors scripts/fetch-review-issues.sh. Keep the two in sync.

            const inlineComments = reviewComments.filter(
              c => c.pull_request_review_id === latestReviewId
            );

            for (const comment of inlineComments) {
              issues.push({
                type: 'inline',
                body: comment.body,
                path: comment.path,
                line: comment.line || comment.original_line,
                user: comment.user.login,
                url: comment.html_url
              });
            }

            const bodyIsOnlySignal = inlineComments.length === 0 &&
                                     latestCodexReview.state === 'CHANGES_REQUESTED' &&
                                     bodyText.trim() !== '';

            if (bodyIsOnlySignal) {
              issues.unshift({
                type: 'review',
                body: bodyText,
                user: latestCodexReview.user.login,
                state: latestCodexReview.state,
                url: latestCodexReview.html_url
              });
            }

            // Surface the review body summary as context (not counted) when
            // there are inline issues. Claude gets the summary for framing
            // without it inflating the issue count.
            const summaryContext = (!bodyIsOnlySignal && bodyText.trim() !== '' &&
                                    latestCodexReview.state !== 'APPROVED')
              ? bodyText : '';

            // Always set review_id + submitted_at + state so the downstream
            // steps can rewrite an existing sticky to a "cleared" state when
            // Codex approves or has no issues. Without this the sticky would
            // stay stuck showing "fixes pushed — awaiting re-review" forever
            // after trigger-rereview.sh neutralizes it.
            core.setOutput('review_id', String(latestReviewId));
            core.setOutput('review_submitted_at', latestCodexReview.submitted_at);
            core.setOutput('review_state', latestCodexReview.state || '');
            core.setOutput('branch', pr.data.head.ref);

            if (issues.length === 0) {
              console.log('No actionable issues in latest Codex review');
              core.setOutput('has_issues', 'false');
              return;
            }

            let prompt = `## Code Review Issues for PR #${prNumber}\n\n`;
            prompt += `**Branch:** \`${pr.data.head.ref}\`\n`;
            prompt += `**Title:** ${pr.data.title}\n`;
            prompt += `**Codex review ID:** ${latestReviewId}\n\n`;

            if (summaryContext) {
              prompt += `**Codex summary (context, not an issue to fix directly):**\n`;
              summaryContext.split('\n').forEach(line => {
                prompt += `> ${line}\n`;
              });
              prompt += `\n`;
            }

            prompt += `Please fix the following ${issues.length} issue(s):\n\n`;

            issues.forEach((issue, i) => {
              prompt += `### Issue ${i + 1}\n`;
              if (issue.path) {
                prompt += `**File:** \`${issue.path}\``;
                if (issue.line) prompt += ` (line ${issue.line})`;
                prompt += `\n`;
              }
              prompt += `**From:** ${issue.user}\n`;
              prompt += `**Feedback:**\n`;
              issue.body.split('\n').forEach(line => {
                prompt += `> ${line}\n`;
              });
              prompt += `\n`;
            });

            prompt += `---\n`;
            prompt += `After fixing, commit and push. Then trigger re-review.\n`;

            core.setOutput('has_issues', 'true');
            core.setOutput('count', issues.length);
            core.setOutput('prompt', prompt);

      - name: Check for existing notification
        id: existing
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const marker = "<!-- claude-review-notification -->";

            let existingComment = null;
            for await (const response of github.paginate.iterator(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100
              }
            )) {
              const found = response.data.find(c => c.body && c.body.includes(marker));
              if (found) {
                existingComment = found;
                break;
              }
            }

            if (existingComment) {
              core.setOutput("comment_id", existingComment.id);
              core.setOutput("exists", "true");
            } else {
              core.setOutput("exists", "false");
            }

      # Run when there are issues (post/update) OR when there's an existing
      # sticky and the latest review cleared it (update to "cleared" state).
      # Without the second branch, `trigger-rereview.sh`'s "awaiting re-review"
      # sticky would stay stuck forever after Codex returns zero issues —
      # the main bug motivating this step's logic.
      - name: Post or update notification
        if: |
          steps.issues.outputs.has_issues == 'true' ||
          steps.existing.outputs.exists == 'true'
        uses: actions/github-script@v7
        env:
          PROMPT_CONTENT: ${{ steps.issues.outputs.prompt }}
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const hasIssues = "${{ steps.issues.outputs.has_issues }}" === "true";
            const reviewId = "${{ steps.issues.outputs.review_id }}";
            const submittedAt = "${{ steps.issues.outputs.review_submitted_at }}";
            const reviewState = "${{ steps.issues.outputs.review_state }}";
            const existingId = "${{ steps.existing.outputs.comment_id }}";
            const prompt = process.env.PROMPT_CONTENT || "";

            const marker = "<!-- claude-review-notification -->";
            const anchor = "<!-- codex-review-id: " + reviewId + " -->";

            let lines;
            if (hasIssues) {
              const issueCount = ${{ steps.issues.outputs.count || 0 }};
              lines = [
                marker,
                anchor,
                "## Review Issues Detected",
                "",
                "Found **" + issueCount + "** issue(s) from Codex review `" + reviewId + "`" +
                  (submittedAt ? " (submitted " + submittedAt + ")." : "."),
                "",
                "### Quick Fix",
                "",
                "In your Claude Code session, run:",
                "```bash",
                "./scripts/fetch-review-issues.sh " + prNumber,
                "```",
                "",
                'Then tell Claude: "Please fix the review issues above"',
                "",
                "<details>",
                "<summary>Click to see formatted issues</summary>",
                "",
                "```",
                prompt,
                "```",
                "</details>"
              ];
            } else {
              // Zero issues + existing sticky → rewrite to cleared state so
              // users don't see "fixes pushed — awaiting re-review" after
              // Codex has actually come back clean.
              const headline = reviewState === "APPROVED"
                ? "## Codex approved — no open issues"
                : "## Codex had no actionable issues";
              lines = [
                marker,
                anchor,
                headline,
                "",
                "Codex review `" + reviewId + "`" +
                  (submittedAt ? " (submitted " + submittedAt + ")" : "") +
                  " returned no actionable feedback.",
                "",
                "Run `./scripts/fetch-review-issues.sh " + prNumber + "` for the",
                "authoritative current state, including any non-Codex reviewer",
                "feedback this notifier doesn't surface."
              ];
            }

            const body = lines.join("\n");

            if (existingId && existingId !== "") {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: parseInt(existingId),
                body: body
              });
              console.log(hasIssues ? "Updated notification (issues)" : "Updated notification (cleared)");
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
              console.log("Created notification");
            }

      - name: Send webhook (optional)
        if: steps.issues.outputs.has_issues == 'true' && vars.REVIEW_WEBHOOK_URL
        env:
          WEBHOOK_URL: ${{ vars.REVIEW_WEBHOOK_URL }}
          WEBHOOK_BRANCH: ${{ steps.issues.outputs.branch }}
        run: |
          jq -n \
            --argjson pr "${{ steps.pr.outputs.number }}" \
            --arg repo "${{ github.repository }}" \
            --arg branch "$WEBHOOK_BRANCH" \
            --argjson issue_count "${{ steps.issues.outputs.count }}" \
            --arg url "https://github.com/${{ github.repository }}/pull/${{ steps.pr.outputs.number }}" \
            '{pr: $pr, repo: $repo, branch: $branch, issue_count: $issue_count, url: $url}' \
          | curl -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @- || echo "Webhook failed (non-fatal)"
